name: Build Android APK

on:
  push:
    branches: [ main, 'claude/android-apk-build-ao7cd5' ]
    paths:
      - 'android/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

jobs:
  build:
    name: Build TWA APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Python for icon generation
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Pillow
        run: pip install Pillow

      - name: Generate launcher icons
        run: |
          python3 - <<'EOF'
          from PIL import Image
          import os

          src_small = "assets/images/icon-192.png"
          src_large = "assets/images/icon-512.png"

          densities = {
              "android/app/src/main/res/mipmap-mdpi":    48,
              "android/app/src/main/res/mipmap-hdpi":    72,
              "android/app/src/main/res/mipmap-xhdpi":   96,
              "android/app/src/main/res/mipmap-xxhdpi":  144,
              "android/app/src/main/res/mipmap-xxxhdpi": 192,
          }

          for path, size in densities.items():
              os.makedirs(path, exist_ok=True)
              source = src_large if size >= 96 else src_small
              img = Image.open(source).convert("RGBA")
              img = img.resize((size, size), Image.LANCZOS)
              img.save(f"{path}/ic_launcher.png", "PNG")
              img.save(f"{path}/ic_launcher_round.png", "PNG")
              # Adaptive icon foreground: 108dp canvas at each density
              fg_size = int(size * 108 / 48)
              fg = Image.open(src_large).convert("RGBA")
              fg = fg.resize((fg_size, fg_size), Image.LANCZOS)
              fg.save(f"{path}/ic_launcher_foreground.png", "PNG")
              print(f"  {size}px → {path}")
          EOF

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.6'

      - name: Build debug APK
        working-directory: android
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: IKS-Android-v1.0-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      # ── Release build — Gradle signing via permanent JKS keystore in secret ──
      - name: Decode release keystore
        run: echo "${{ secrets.RELEASE_KEYSTORE_B64 }}" | base64 --decode > android/iks-release.jks

      - name: Build and sign release APK
        working-directory: android
        env:
          KEYSTORE_FILE: ${{ github.workspace }}/android/iks-release.jks
          KEYSTORE_PASS: ${{ secrets.RELEASE_KEYSTORE_PASS }}
        run: gradle assembleRelease --no-daemon

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: IKS-Android-v1.0-release
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30
